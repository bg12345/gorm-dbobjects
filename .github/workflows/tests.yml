name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dbobjects_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      mysql:
        image: mysql:8
        env:
          # root is a reserved user for this image -- set its password
          # via MYSQL_ROOT_PASSWORD rather than MYSQL_USER/MYSQL_PASSWORD,
          # which create a separate, non-root user instead.
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: dbobjects_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

      sqlserver:
        image: mcr.microsoft.com/mssql/server:latest
        env:
          ACCEPT_EULA: Y
          # Test-only credential, matching this repo's existing
          # postgres/mysql precedent of literal, non-secret test creds.
          MSSQL_SA_PASSWORD: "yourStrong(!)Password1"
        ports:
          - 1433:1433
        options: >-
          --health-cmd="/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P 'yourStrong(!)Password1' -Q 'SELECT 1'"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      POSTGRES_HOST: localhost
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: dbobjects_test
      POSTGRES_PORT: 5432
      POSTGRES_SSLMODE: disable

      MYSQL_HOST: localhost
      MYSQL_USER: root
      MYSQL_PASSWORD: root
      MYSQL_DB: dbobjects_test
      MYSQL_PORT: 3306

      MSSQL_HOST: localhost
      MSSQL_USER: sa
      MSSQL_PASSWORD: "yourStrong(!)Password1"
      MSSQL_DB: dbobjects_test
      MSSQL_PORT: 1433

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify go.mod / go.sum are tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Vet
        run: go vet ./...

      # Unlike the postgres/mysql images (POSTGRES_DB/MYSQL_DATABASE
      # provision a named database on startup), the mssql/server image
      # only stands up the engine (default master) -- no equivalent env
      # var creates one, so it's provisioned explicitly here rather than
      # inside internal/testutil.NewSQLServer (which, like NewPostgres/
      # NewMySQL, only opens a connection and issues no DDL itself).
      # sqlcmd lives inside the service container's own image, not on
      # the runner -- --health-cmd above runs inside the container
      # automatically via Docker's own healthcheck mechanism, but this
      # step is a normal run: step executing on the runner, so it has to
      # reach sqlcmd via docker exec against the running service
      # container instead of calling the binary path directly.
      - name: Create SQL Server test database
        run: |
          docker exec $(docker ps -q --filter ancestor=mcr.microsoft.com/mssql/server:latest) \
            /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P "$MSSQL_PASSWORD" \
            -Q "IF NOT EXISTS (SELECT * FROM sys.databases WHERE name = N'$MSSQL_DB') CREATE DATABASE $MSSQL_DB;"

      - name: Test
        run: go test -race -v ./...
